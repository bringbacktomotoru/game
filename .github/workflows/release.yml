name: Release Builds

on:
  push:
    tags:
      - "v*"
      - "!v0.0.1"
  workflow_dispatch:
    inputs:
      online_url:
        description: "Override ONLINE_SERVER_URL (optional; defaults to repository secret)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Original, Offline, Online & Test APKs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Android & Java build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk-headless zipalign apksigner smali dalvik-exchange libandroid-23-java

      - name: Install Python dependencies
        run: pip install -e ".[sxr]"

      - name: Fetch verified base APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.assets.fetch_base

      - name: Prepare signing keystore (if configured in secrets)
        id: keystore
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > /tmp/release.keystore
            echo "args=--keystore /tmp/release.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK variants (original, offline, online)
        env:
          ONLINE_SERVER_URL: ${{ inputs.online_url || secrets.ONLINE_SERVER_URL }}
          SIGNING_KS_PASS: ${{ secrets.SIGNING_KS_PASS || 'android' }}
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS || 'android' }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'tomotoru' }}
        run: |
          mkdir -p dist/release dist/test

          # 1. Original unmodified base APK
          python -m tools.build.build_apk --mode original -o dist/release/tomotoru-v1.0.4-original.apk

          # 2. Offline standalone APK (embedded Java server on 127.0.0.1:18080)
          python -m tools.build.build_apk --mode offline ${{ steps.keystore.outputs.args }} \
            -o dist/release/tomotoru-offline.apk

          # 3. Online APK (points to repository secret ONLINE_SERVER_URL)
          if [ -n "$ONLINE_SERVER_URL" ]; then
            python -m tools.build.build_apk --mode online ${{ steps.keystore.outputs.args }} \
              -o dist/release/tomotoru-online.apk
          else
            echo "::warning::ONLINE_SERVER_URL secret is not set; skipping tomotoru-online.apk"
          fi

          # 4. Test variants (--debug enabled; online-test points to http://127.0.0.1:18880)
          python -m tools.build.build_apk --mode offline-test ${{ steps.keystore.outputs.args }} \
            -o dist/test/tomotoru-offline-test.apk
          python -m tools.build.build_apk --mode online-test ${{ steps.keystore.outputs.args }} \
            -o dist/test/tomotoru-online-test.apk

          (cd dist/release && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload offline-test artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-test
          path: dist/test/tomotoru-offline-test.apk
          retention-days: 30

      - name: Upload online-test artifact
        uses: actions/upload-artifact@v4
        with:
          name: online-test
          path: dist/test/tomotoru-online-test.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && github.ref_name != 'v0.0.1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The shallow checkout may only have the commit behind the annotated tag.
          git fetch --depth=1 --no-tags origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          gh release create "${GITHUB_REF_NAME}" \
            dist/release/*.apk \
            dist/release/SHA256SUMS.txt \
            --title "Tomotoru Game Client ${GITHUB_REF_NAME}" \
            --verify-tag \
            --notes-from-tag

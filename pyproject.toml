[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tomotoru"
version = "0.3.0"
description = "Reverse engineering toolkit, APK build pipeline, and offline/online servers for Tomotoru (Sanrio Characters)"
requires-python = ">=3.10"
dependencies = [
    "flask>=2.0",
    "pycryptodome>=3.19",
    "lz4>=4.0",
]

[project.optional-dependencies]
sxr = ["lz4>=4.0"]
dev = ["pytest>=8.0"]

[project.scripts]
tomotoru-server = "server.python.mock:main"
tomotoru-build = "tools.build.build_apk:main"
tomotoru-fetch-base = "tools.assets.fetch_base:main"

[tool.setuptools.packages.find]
include = ["server*", "tools*"]

[tool.flask]
app = "server.python.mock:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

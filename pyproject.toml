[project]
name = "tomotoru"
version = "0.2.0"
description = "Reverse engineering toolkit and offline mock server for Tomotoru (Sanrio Characters)"
requires-python = ">=3.10"
dependencies = [
    "flask>=2.0",
    "pycryptodome>=3.19",
    "lz4>=4.0",
]

[project.optional-dependencies]
sxr = ["lz4>=4.0"]
dev = ["pytest>=8.0"]

[project.scripts]
tomotoru-server = "tools.server.mock:main"
tomotoru-patch = "tools.patcher.patch_apk:main"

[tool.flask]
app = "tools.server.mock:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
